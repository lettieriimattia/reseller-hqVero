<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- viewport-fit=cover per il notch iPhone, user-scalable=no previene zoom accidentale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HQVault" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="HQVault" />
    <meta name="description" content="HQVault — Il tuo gestionale" />
    <title>HQVault</title>
    <!-- Splash screen: appare istantaneamente (prima di React), animazione logo ~2s -->
    <style>
      #hq-splash {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(125% 80% at 50% 24%, #1b1b21 0%, #0b0b0e 55%, #050506 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
        transition: opacity .6s cubic-bezier(.4, 0, .2, 1);
      }
      #hq-splash.hq-light { background: #e7e7ec; }
      #hq-splash.hq-hide  { opacity: 0; pointer-events: none; }
      /* === Splash "HEADQUARTERS → HQ" cromato + barra di caricamento === */
      #hq-splash .hq-stage{ position:relative; display:flex; flex-direction:column; align-items:center; gap:32px; }
      #hq-splash .hq-logo-area{ position:relative; display:flex; align-items:center; justify-content:center; min-height:130px; width:min(560px,92vw); }
      /* Cromo: gradiente argento + lucentezza, clip sul testo */
      .hq-chrome{
        background:linear-gradient(177deg,#fbfbfc 0%,#d2d5d9 24%,#83878f 48%,#34373d 58%,#9aa0a8 74%,#eceef0 100%);
        -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
        filter:drop-shadow(0 1px 0 rgba(255,255,255,.22)) drop-shadow(0 8px 22px rgba(0,0,0,.65));
      }
      .hq-light .hq-chrome{
        background:linear-gradient(177deg,#4a4d54,#15171b 52%,#54575e);
        -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
      }
      /* "HEADQUARTERS": le lettere "filler" collassano, restano H e Q che si avvicinano → "HQ". */
      #hq-splash .hq-word{
        font-weight:800; font-size:clamp(22px,6.6vw,44px); letter-spacing:.04em;
        white-space:nowrap; opacity:0; animation:hqWord 2.5s cubic-bezier(.7,0,.2,1) forwards;
        filter:drop-shadow(0 2px 10px rgba(0,0,0,.55));
      }
      /* ogni lettera è cromata singolarmente (così le filler possono collassare) */
      #hq-splash .hq-word span{
        background:linear-gradient(177deg,#fbfbfc 0%,#d2d5d9 24%,#83878f 48%,#34373d 58%,#9aa0a8 74%,#eceef0 100%);
        -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
      }
      .hq-light #hq-splash .hq-word span{ background:linear-gradient(177deg,#4a4d54,#15171b 52%,#54575e); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
      /* le filler (EAD / UARTERS) si chiudono a larghezza zero → H e Q si uniscono in "HQ" */
      #hq-splash .hq-word .fl{ display:inline-block; overflow:hidden; vertical-align:bottom; max-width:7ch; animation:hqFill 2.5s cubic-bezier(.7,0,.2,1) forwards; }
      @keyframes hqWord{ 0%{opacity:0} 12%{opacity:1} 52%{opacity:1} 66%{opacity:0} 100%{opacity:0} }
      @keyframes hqFill{ 0%,16%{max-width:7ch; opacity:1} 48%{max-width:0; opacity:0} 100%{max-width:0; opacity:0} }
      /* Il logo entra MENTRE H e Q si uniscono e ne prende il posto (crossfade, in contemporanea). */
      @keyframes hqMono{
        0%,40%{opacity:0; transform:scale(.74); filter:blur(7px)}
        64%{opacity:1; transform:scale(1.04); filter:blur(0)}
        82%{transform:scale(.99)}
        100%{opacity:1; transform:scale(1)}
      }
      /* Logo immagine (foto cromata): se presente copre la "HQ" di testo (fallback). Stessa animazione. */
      #hq-splash .hq-mono-img{
        position:absolute; inset:0; margin:auto; height:150px; width:auto; max-width:88%; object-fit:contain;
        opacity:0; transform:scale(.62); animation:hqMono 2.5s cubic-bezier(.2,.7,.2,1) forwards;
        filter:drop-shadow(0 12px 34px rgba(0,0,0,.55));
      }
      @media (min-width:768px){ #hq-splash .hq-mono-img{ height:152px; } }
      @media (prefers-reduced-motion: reduce){ #hq-splash .hq-mono-img{ animation:none; opacity:1; transform:scale(1); } }
      /* Barra di caricamento */
      #hq-splash .hq-bar{ width:min(190px,54vw); height:3px; border-radius:99px; background:rgba(255,255,255,.10); overflow:hidden; }
      .hq-light #hq-splash .hq-bar, #hq-splash.hq-light .hq-bar{ background:rgba(0,0,0,.08); }
      #hq-splash .hq-bar > i{ display:block; height:100%; width:0; border-radius:99px;
        background:linear-gradient(90deg,#6a6e76,#eceef0,#6a6e76); animation:hqBar 2.5s ease-out forwards; }
      @keyframes hqBar{ 0%{width:0} 68%{width:76%} 100%{width:100%} }
      @media (prefers-reduced-motion: reduce){
        #hq-splash .hq-word{ animation:none; opacity:0; }
        #hq-splash .hq-mono{ animation:none; opacity:1; transform:scale(1); filter:none; }
        #hq-splash .hq-bar>i{ animation:none; width:100%; }
      }
    </style>
  </head>
  <body>
    <!-- Splash istantanea: tema coerente + auto-rimozione dopo ~2s -->
    <div id="hq-splash">
      <div class="hq-stage">
        <div class="hq-logo-area">
          <div class="hq-word"><span>H</span><span class="fl">EAD</span><span>Q</span><span class="fl">UARTERS</span></div>
          <img class="hq-mono-img" src="/logo.png" alt="HQVault" />
        </div>
        <div class="hq-bar"><i></i></div>
      </div>
    </div>
    <script>
      (function () {
        var s = document.getElementById('hq-splash');
        if (!s) return;
        try { if (localStorage.getItem('hq-theme') === 'light') s.classList.add('hq-light'); } catch (e) {}
        var done = false;
        function hide() {
          if (done) return; done = true;
          s.classList.add('hq-hide');
          setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 680);
        }
        // Video AI (se presente): mostralo sopra l'SVG, e chiudi lo splash quando finisce.
        var v = document.getElementById('hq-vault-video');
        var hasVideo = false;
        if (v) {
          v.addEventListener('loadeddata', function () { v.classList.add('vl-on'); });
          v.addEventListener('playing', function () { hasVideo = true; });
          v.addEventListener('ended', hide);
        }
        // Senza video: nascondi dopo ~2.7s (animazione SVG). Col video: lascia finire ('ended'),
        // con un tetto di sicurezza a 4s perché lo splash non resti mai bloccato.
        setTimeout(function () { if (!hasVideo) hide(); }, 2700);
        setTimeout(hide, 4000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Blocca pinch-to-zoom su iOS Safari (ignora user-scalable=no)
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      // Blocca double-tap zoom
      var lastTap = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTap < 300) e.preventDefault();
        lastTap = now;
      }, { passive: false });
    </script>
  </body>
</html>
