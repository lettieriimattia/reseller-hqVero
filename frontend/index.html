<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- viewport-fit=cover per il notch iPhone, user-scalable=no previene zoom accidentale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HQVault" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="HQVault" />
    <meta name="description" content="HQVault — Il tuo gestionale" />
    <title>HQVault</title>
    <!-- Splash screen: appare istantaneamente (prima di React), animazione logo ~2s -->
    <style>
      #hq-splash {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(125% 80% at 50% 24%, #1b1b21 0%, #0b0b0e 55%, #050506 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
        transition: opacity .5s ease;
      }
      #hq-splash.hq-light { background: #e7e7ec; }
      #hq-splash.hq-hide  { opacity: 0; pointer-events: none; }
      /* Ambiente: pavimento riflettente (il caveau in una stanza). */
      #hq-splash .vl-floor{ position:absolute; left:0; right:0; bottom:0; height:34%; background:linear-gradient(180deg, transparent, rgba(255,255,255,.03) 38%, rgba(0,0,0,.55)); border-top:1px solid rgba(255,255,255,.05); }
      /* Caveau realistico che si CHIUDE: porta che sbatte, chiavistelli+volantino che girano. */
      @keyframes vlSlam  { 0%{transform:scale(.88) rotate(-6deg);opacity:0} 24%{opacity:1} 62%{transform:scale(1.02) rotate(1.5deg)} 80%{transform:scale(.994) rotate(-.6deg)} 100%{transform:scale(1) rotate(0)} }
      @keyframes vlWheel { 0%,26%{transform:rotate(0)} 82%,100%{transform:rotate(135deg)} }
      @keyframes vlMech  { 0%,26%{transform:rotate(0)} 82%,100%{transform:rotate(-22deg)} }
      @keyframes vlGlow  { 0%,60%{opacity:.06} 82%{opacity:.42} 100%{opacity:.26} }
      #hq-splash .vl-wrap{ position:relative; width:min(360px,90vw); height:min(360px,90vw); display:flex; align-items:center; justify-content:center; }
      #hq-splash .vl-glowdiv{ position:absolute; inset:6%; border-radius:50%; background:radial-gradient(circle,rgba(44,156,142,.8),transparent 60%); filter:blur(26px); animation:vlGlow 3.4s ease infinite; }
      #hq-splash .vl-door{ transform-origin:200px 200px; animation:vlSlam 3.4s cubic-bezier(.3,.72,.2,1) infinite; }
      #hq-splash .vl-wheel{ transform-origin:200px 200px; animation:vlWheel 3.4s cubic-bezier(.4,0,.2,1) infinite; }
      #hq-splash .vl-mech{ transform-origin:200px 200px; animation:vlMech 3.4s cubic-bezier(.4,0,.2,1) infinite; }
      @media (prefers-reduced-motion: reduce) { #hq-splash .vl-door,#hq-splash .vl-wheel,#hq-splash .vl-mech{ animation:none; } }
    </style>
  </head>
  <body>
    <!-- Splash istantanea: tema coerente + auto-rimozione dopo ~2s -->
    <div id="hq-splash">
      <div class="vl-floor"></div>
      <div class="vl-wrap">
        <div class="vl-glowdiv"></div>
        <svg viewBox="0 0 400 400" width="100%" height="100%" style="position:relative;filter:drop-shadow(0 20px 56px rgba(0,0,0,.8))">
          <defs>
            <radialGradient id="vSteelS" cx="40%" cy="26%" r="82%"><stop offset="0%" stop-color="#56565f"/><stop offset="46%" stop-color="#26262d"/><stop offset="100%" stop-color="#090a0d"/></radialGradient>
            <radialGradient id="vDoorS" cx="42%" cy="28%" r="84%"><stop offset="0%" stop-color="#50505b"/><stop offset="50%" stop-color="#212129"/><stop offset="100%" stop-color="#0d0d12"/></radialGradient>
            <linearGradient id="vRimS" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0%" stop-color="#8e8e9a"/><stop offset="48%" stop-color="#2c2c34"/><stop offset="100%" stop-color="#5e5e68"/></linearGradient>
            <linearGradient id="vBarS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a0a0ac"/><stop offset="44%" stop-color="#3a3a44"/><stop offset="56%" stop-color="#56565f"/><stop offset="100%" stop-color="#15151b"/></linearGradient>
            <radialGradient id="vHubS" cx="40%" cy="34%" r="72%"><stop offset="0%" stop-color="#a0a0ac"/><stop offset="58%" stop-color="#3a3a44"/><stop offset="100%" stop-color="#131319"/></radialGradient>
            <radialGradient id="vSpecS" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(255,255,255,.55)"/><stop offset="70%" stop-color="rgba(255,255,255,.06)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></radialGradient>
          </defs>
          <rect x="8" y="8" width="384" height="384" rx="16" fill="url(#vSteelS)" stroke="#101015" stroke-width="3"/>
          <rect x="26" y="26" width="348" height="348" rx="9" fill="none" stroke="#0b0b10" stroke-width="2"/>
          <rect x="38" y="38" width="324" height="324" rx="6" fill="none" stroke="#6a6a74" stroke-width="7" stroke-dasharray="2.5 40" stroke-linecap="round"/>
          <g fill="url(#vBarS)" stroke="#101015" stroke-width="2"><rect x="34" y="120" width="34" height="64" rx="11"/><rect x="34" y="216" width="34" height="64" rx="11"/><rect x="44" y="150" width="14" height="100" rx="6" fill="#23232a"/></g>
          <g><rect x="320" y="172" width="44" height="56" rx="6" fill="url(#vBarS)" stroke="#101015" stroke-width="2"/><circle cx="342" cy="200" r="13" fill="url(#vHubS)" stroke="#101015" stroke-width="2"/><circle cx="342" cy="200" r="4" fill="#0c0c11"/></g>
          <circle cx="200" cy="200" r="172" fill="none" stroke="#0c0c11" stroke-width="3"/>
          <circle cx="200" cy="200" r="160" fill="none" stroke="url(#vRimS)" stroke-width="22"/>
          <circle cx="200" cy="200" r="147" fill="none" stroke="#0c0c11" stroke-width="3"/>
          <circle cx="200" cy="200" r="160" fill="none" stroke="#6c6c76" stroke-width="9.2" stroke-dasharray="2.5 33" stroke-linecap="round"/>
          <circle cx="200" cy="200" r="138" fill="#000" opacity="0.45"/>
          <g class="vl-door">
            <circle cx="200" cy="200" r="134" fill="url(#vDoorS)" stroke="#3c3c46" stroke-width="4"/>
            <g class="vl-mech">
              <circle cx="200" cy="200" r="120" fill="none" stroke="#6a6a76" stroke-width="9" stroke-dasharray="3 13"/>
              <circle cx="200" cy="200" r="104" fill="none" stroke="#3a3a44" stroke-width="2"/>
              <circle cx="200" cy="200" r="92" fill="none" stroke="#6a6a76" stroke-width="7" stroke-dasharray="2 11"/>
            </g>
            <circle cx="200" cy="200" r="78" fill="none" stroke="#0e0e14" stroke-width="2"/>
            <ellipse cx="150" cy="142" rx="78" ry="50" fill="url(#vSpecS)" opacity="0.5"/>
            <g class="vl-wheel">
              <g stroke="url(#vBarS)" stroke-width="22" stroke-linecap="round">
                <line x1="200" y1="200" x2="350" y2="200"/><line x1="200" y1="200" x2="200" y2="350"/><line x1="200" y1="200" x2="50" y2="200"/><line x1="200" y1="200" x2="200" y2="50"/>
              </g>
              <g fill="url(#vHubS)" stroke="#101015" stroke-width="2"><circle cx="350" cy="200" r="14"/><circle cx="200" cy="350" r="14"/><circle cx="50" cy="200" r="14"/><circle cx="200" cy="50" r="14"/></g>
              <g stroke="url(#vBarS)" stroke-width="9" stroke-linecap="round"><line x1="200" y1="200" x2="259" y2="224"/><line x1="200" y1="200" x2="224" y2="259"/><line x1="200" y1="200" x2="176" y2="259"/><line x1="200" y1="200" x2="141" y2="224"/><line x1="200" y1="200" x2="141" y2="176"/><line x1="200" y1="200" x2="176" y2="141"/><line x1="200" y1="200" x2="224" y2="141"/><line x1="200" y1="200" x2="259" y2="176"/></g>
              <circle cx="200" cy="200" r="64" fill="none" stroke="url(#vRimS)" stroke-width="6"/>
              <circle cx="200" cy="200" r="34" fill="url(#vHubS)" stroke="#101015" stroke-width="3"/>
              <circle cx="200" cy="200" r="26" fill="none" stroke="#7a7a86" stroke-width="1.5"/>
              <circle cx="200" cy="200" r="11" fill="#0b0b10"/>
            </g>
          </g>
        </svg>
      </div>
    </div>
    <script>
      (function () {
        var s = document.getElementById('hq-splash');
        if (!s) return;
        try { if (localStorage.getItem('hq-theme') === 'light') s.classList.add('hq-light'); } catch (e) {}
        setTimeout(function () {
          s.classList.add('hq-hide');
          setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 550);
        }, 2700);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Blocca pinch-to-zoom su iOS Safari (ignora user-scalable=no)
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      // Blocca double-tap zoom
      var lastTap = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTap < 300) e.preventDefault();
        lastTap = now;
      }, { passive: false });
    </script>
  </body>
</html>
