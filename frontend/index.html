<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- viewport-fit=cover per il notch iPhone, user-scalable=no previene zoom accidentale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HQVault" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="HQVault" />
    <meta name="description" content="HQVault — Il tuo gestionale" />
    <title>HQVault</title>
    <!-- Splash screen: appare istantaneamente (prima di React), animazione logo ~2s -->
    <style>
      #hq-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #080808;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
        transition: opacity .5s ease;
      }
      #hq-splash.hq-light { background: #e7e7ec; }
      #hq-splash.hq-hide  { opacity: 0; pointer-events: none; }
      /* Caveau che si CHIUDE (SVG da zero), grande e responsive: la porta sbatte, il volantino
         cromato gira a bloccare, la luce diventa teal. In loop finché l'app carica. */
      @keyframes vlSlam  { 0%{transform:scale(.84) rotate(-8deg);opacity:0} 22%{opacity:1} 58%{transform:scale(1.025) rotate(2deg)} 78%{transform:scale(.992) rotate(-.8deg)} 100%{transform:scale(1) rotate(0)} }
      @keyframes vlWheel { 0%,24%{transform:rotate(0)} 76%,100%{transform:rotate(270deg)} }
      @keyframes vlLight { 0%,64%{fill:#33333a} 74%{fill:#7defdf} 100%{fill:#2c9c8e} }
      @keyframes vlGlow  { 0%,58%{opacity:.08} 80%{opacity:.5} 100%{opacity:.3} }
      @keyframes vlSheen { to { transform: rotate(360deg); } }
      #hq-splash .vl-wrap{ position:relative; width:min(320px,84vw); height:min(320px,84vw); display:flex; align-items:center; justify-content:center; }
      #hq-splash .vl-glowdiv{ position:absolute; inset:6%; border-radius:50%; background:radial-gradient(circle,rgba(44,156,142,.85),transparent 60%); filter:blur(22px); animation:vlGlow 3.2s ease infinite; }
      #hq-splash .vl-door{ transform-origin:160px 160px; animation:vlSlam 3.2s cubic-bezier(.32,.72,.2,1) infinite; }
      #hq-splash .vl-wheel{ transform-origin:160px 160px; animation:vlWheel 3.2s cubic-bezier(.4,0,.2,1) infinite; }
      #hq-splash .vl-light{ animation:vlLight 3.2s ease infinite; }
      @media (prefers-reduced-motion: reduce) { #hq-splash .vl-door,#hq-splash .vl-wheel{ animation:none; } }
    </style>
  </head>
  <body>
    <!-- Splash istantanea: tema coerente + auto-rimozione dopo ~2s -->
    <div id="hq-splash">
      <div class="vl-wrap">
        <div class="vl-glowdiv"></div>
        <svg viewBox="0 0 320 320" width="100%" height="100%" style="position:relative;filter:drop-shadow(0 18px 50px rgba(0,0,0,.75))">
          <defs>
            <radialGradient id="vSteelS" cx="38%" cy="28%" r="82%"><stop offset="0%" stop-color="#4a4a55"/><stop offset="48%" stop-color="#24242b"/><stop offset="100%" stop-color="#0b0b0f"/></radialGradient>
            <radialGradient id="vDoorS" cx="40%" cy="30%" r="85%"><stop offset="0%" stop-color="#454550"/><stop offset="52%" stop-color="#1f1f27"/><stop offset="100%" stop-color="#101015"/></radialGradient>
            <linearGradient id="vRimS" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#74747f"/><stop offset="45%" stop-color="#2a2a32"/><stop offset="100%" stop-color="#5a5a64"/></linearGradient>
            <linearGradient id="vChromeS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9a9aa6"/><stop offset="42%" stop-color="#3c3c46"/><stop offset="55%" stop-color="#5c5c66"/><stop offset="100%" stop-color="#191920"/></linearGradient>
          </defs>
          <rect x="12" y="12" width="296" height="296" rx="48" fill="url(#vSteelS)" stroke="#34343d" stroke-width="2.5"/>
          <rect x="20" y="20" width="280" height="280" rx="42" fill="none" stroke="#0c0c11" stroke-width="2"/>
          <g fill="url(#vChromeS)" stroke="#141419" stroke-width="2"><rect x="16" y="112" width="28" height="40" rx="8"/><rect x="16" y="168" width="28" height="40" rx="8"/></g>
          <circle cx="160" cy="160" r="138" fill="none" stroke="#0d0d12" stroke-width="2"/>
          <circle cx="160" cy="160" r="128" fill="none" stroke="url(#vRimS)" stroke-width="18"/>
          <circle cx="160" cy="160" r="118" fill="none" stroke="#0d0d12" stroke-width="3"/>
          <circle cx="160" cy="160" r="128" fill="none" stroke="#5c5c66" stroke-width="8.4" stroke-dasharray="2.5 38" stroke-linecap="round"/>
          <circle cx="160" cy="160" r="110" fill="#000" opacity="0.4"/>
          <g class="vl-door">
            <circle cx="160" cy="160" r="106" fill="url(#vDoorS)" stroke="#3c3c46" stroke-width="4"/>
            <circle cx="160" cy="160" r="94" fill="none" stroke="#0e0e14" stroke-width="2"/>
            <circle cx="160" cy="160" r="80" fill="none" stroke="#3a3a44" stroke-width="1.5"/>
            <circle cx="160" cy="160" r="72" fill="none" stroke="#6a6a76" stroke-width="7" stroke-dasharray="2 10.6"/>
            <g class="vl-wheel">
              <g stroke="url(#vChromeS)" stroke-width="13" stroke-linecap="round">
                <line x1="160" y1="98" x2="160" y2="222"/><line x1="98" y1="160" x2="222" y2="160"/><line x1="116" y1="116" x2="204" y2="204"/><line x1="204" y1="116" x2="116" y2="204"/>
              </g>
              <g fill="url(#vChromeS)" stroke="#141419" stroke-width="1.5"><circle cx="222" cy="160" r="9"/><circle cx="204" cy="204" r="9"/><circle cx="160" cy="222" r="9"/><circle cx="116" cy="204" r="9"/><circle cx="98" cy="160" r="9"/><circle cx="116" cy="116" r="9"/><circle cx="160" cy="98" r="9"/><circle cx="204" cy="116" r="9"/></g>
              <circle cx="160" cy="160" r="28" fill="url(#vChromeS)" stroke="#141419" stroke-width="3"/>
              <circle cx="160" cy="160" r="22" fill="none" stroke="#6e6e7a" stroke-width="1"/>
              <circle cx="160" cy="160" r="9" fill="#0c0c11"/>
            </g>
          </g>
          <circle cx="160" cy="30" r="8" fill="#0e0e14" stroke="#2c2c34" stroke-width="2"/>
          <circle class="vl-light" cx="160" cy="30" r="4.6" fill="#33333a"/>
        </svg>
      </div>
    </div>
    <script>
      (function () {
        var s = document.getElementById('hq-splash');
        if (!s) return;
        try { if (localStorage.getItem('hq-theme') === 'light') s.classList.add('hq-light'); } catch (e) {}
        setTimeout(function () {
          s.classList.add('hq-hide');
          setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 550);
        }, 2700);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Blocca pinch-to-zoom su iOS Safari (ignora user-scalable=no)
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      // Blocca double-tap zoom
      var lastTap = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTap < 300) e.preventDefault();
        lastTap = now;
      }, { passive: false });
    </script>
  </body>
</html>
