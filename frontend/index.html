<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- viewport-fit=cover per il notch iPhone, user-scalable=no previene zoom accidentale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HQ" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="HQ" />
    <meta name="description" content="HQ — Il tuo gestionale" />
    <title>HQ</title>
    <!-- Splash screen: appare istantaneamente (prima di React), animazione logo ~2s -->
    <style>
      #hq-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #080808;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
        transition: opacity .5s ease;
      }
      #hq-splash.hq-light { background: #e7e7ec; }
      #hq-splash.hq-hide  { opacity: 0; pointer-events: none; }
      #hq-splash .hq-mark { position: relative; width: 132px; height: 132px; }
      #hq-splash .hq-mark span {
        position: absolute; font-weight: 900; font-size: 92px; line-height: 1; letter-spacing: -4px;
        opacity: 0; transform: translateY(10px) scale(.9);
        animation: hqIn .7s cubic-bezier(.2,.7,.2,1) forwards;
      }
      #hq-splash .hq-mark .h { top: 2px;  left: 8px;  color: #fff; }
      #hq-splash .hq-mark .q { top: 38px; left: 52px; color: rgba(255,255,255,.42); animation-delay: .14s; }
      #hq-splash.hq-light .hq-mark .h { color: #18181b; }
      #hq-splash.hq-light .hq-mark .q { color: rgba(24,24,27,.40); }
      @keyframes hqIn { to { opacity: 1; transform: translateY(0) scale(1); } }
      #hq-splash .hq-bar {
        margin-top: 34px; width: 88px; height: 2px; border-radius: 2px;
        background: rgba(255,255,255,.10); overflow: hidden;
      }
      #hq-splash.hq-light .hq-bar { background: rgba(0,0,0,.10); }
      #hq-splash .hq-bar::after {
        content: ''; display: block; height: 100%; width: 0; border-radius: 2px;
        background: #ff4d00; animation: hqBar 1.5s ease-in-out .25s forwards;
      }
      @keyframes hqBar { 0% { width: 0 } 70% { width: 100% } 100% { width: 100% } }
      @media (prefers-reduced-motion: reduce) {
        #hq-splash .hq-mark span, #hq-splash .hq-bar::after { animation-duration: .01ms; opacity: 1; transform: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- Splash istantanea: tema coerente + auto-rimozione dopo ~2s -->
    <div id="hq-splash">
      <div class="hq-mark"><span class="h">H</span><span class="q">Q</span></div>
      <div class="hq-bar"></div>
    </div>
    <script>
      (function () {
        var s = document.getElementById('hq-splash');
        if (!s) return;
        try { if (localStorage.getItem('hq-theme') === 'light') s.classList.add('hq-light'); } catch (e) {}
        setTimeout(function () {
          s.classList.add('hq-hide');
          setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 550);
        }, 1900);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Blocca pinch-to-zoom su iOS Safari (ignora user-scalable=no)
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      // Blocca double-tap zoom
      var lastTap = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTap < 300) e.preventDefault();
        lastTap = now;
      }, { passive: false });
    </script>
  </body>
</html>
