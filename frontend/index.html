<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- viewport-fit=cover per il notch iPhone, user-scalable=no previene zoom accidentale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HQVault" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="HQVault" />
    <meta name="description" content="HQVault — Il tuo gestionale" />
    <title>HQVault</title>
    <!-- Splash screen: appare istantaneamente (prima di React), animazione logo ~2s -->
    <style>
      #hq-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #080808;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
        transition: opacity .5s ease;
      }
      #hq-splash.hq-light { background: #e7e7ec; }
      #hq-splash.hq-hide  { opacity: 0; pointer-events: none; }
      /* Cassaforte HQVault che si "sigilla": il logo scatta in posizione di blocco,
         anello combinazione che ruota, bagliore teal (la luce della cassaforte). */
      #hq-splash .vault { position: relative; width: 168px; height: 168px; display: flex; align-items: center; justify-content: center; }
      #hq-splash .vault .glow {
        position: absolute; width: 168px; height: 168px; border-radius: 30px;
        background: radial-gradient(circle, rgba(44,156,142,.30), transparent 62%);
        animation: vGlow 2.1s ease-in-out infinite;
      }
      #hq-splash .vault .ring {
        position: absolute; width: 168px; height: 168px; border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 76%, rgba(44,156,142,.62) 85%, transparent 91%);
        -webkit-mask: radial-gradient(farthest-side, transparent 71%, #000 73%);
        mask: radial-gradient(farthest-side, transparent 71%, #000 73%);
        animation: vDial 2.5s cubic-bezier(.45,0,.2,1) infinite;
      }
      #hq-splash .vault img {
        position: relative; width: 138px; height: 138px; border-radius: 28px; opacity: 0;
        filter: drop-shadow(0 12px 44px rgba(0,0,0,.7));
        animation: vSeal 1.6s cubic-bezier(.16,1,.3,1) .1s forwards;
      }
      @keyframes vSeal {
        0%   { opacity: 0; transform: rotate(-128deg) scale(.68); filter: blur(3px) drop-shadow(0 12px 44px rgba(0,0,0,.7)); }
        58%  { opacity: 1; transform: rotate(7deg) scale(1.05);   filter: blur(0)   drop-shadow(0 12px 44px rgba(0,0,0,.7)); }
        74%  { transform: rotate(-3deg) scale(.985); }
        100% { opacity: 1; transform: rotate(0deg) scale(1); }
      }
      @keyframes vDial { to { transform: rotate(360deg); } }
      @keyframes vGlow { 0%,100% { opacity:.22; transform:scale(.95);} 50% { opacity:.55; transform:scale(1.07);} }
      @media (prefers-reduced-motion: reduce) {
        #hq-splash .vault img { animation-duration: .01ms; opacity: 1; transform: none; filter: none; }
        #hq-splash .vault .ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- Splash istantanea: tema coerente + auto-rimozione dopo ~2s -->
    <div id="hq-splash">
      <div class="vault"><div class="glow"></div><div class="ring"></div><img src="/logo.png" alt="HQVault" /></div>
    </div>
    <script>
      (function () {
        var s = document.getElementById('hq-splash');
        if (!s) return;
        try { if (localStorage.getItem('hq-theme') === 'light') s.classList.add('hq-light'); } catch (e) {}
        setTimeout(function () {
          s.classList.add('hq-hide');
          setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 550);
        }, 1900);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Blocca pinch-to-zoom su iOS Safari (ignora user-scalable=no)
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      // Blocca double-tap zoom
      var lastTap = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTap < 300) e.preventDefault();
        lastTap = now;
      }, { passive: false });
    </script>
  </body>
</html>
