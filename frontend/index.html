<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- viewport-fit=cover per il notch iPhone, user-scalable=no previene zoom accidentale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HQVault" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="HQVault" />
    <meta name="description" content="HQVault — Il tuo gestionale" />
    <title>HQVault</title>
    <!-- Splash screen: appare istantaneamente (prima di React), animazione logo ~2s -->
    <style>
      #hq-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #080808;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
        transition: opacity .5s ease;
      }
      #hq-splash.hq-light { background: #e7e7ec; }
      #hq-splash.hq-hide  { opacity: 0; pointer-events: none; }
      /* Cassaforte che si CHIUDE (SVG da zero): la porta sbatte, il volantino gira a bloccare,
         la luce diventa teal. In loop finché l'app carica. */
      @keyframes vlSlam  { 0%{transform:scale(.5) rotate(-16deg);opacity:0} 28%{opacity:1} 55%{transform:scale(1.07) rotate(4deg)} 72%{transform:scale(.97) rotate(-1.5deg)} 100%{transform:scale(1) rotate(0)} }
      @keyframes vlWheel { 0%,16%{transform:rotate(0)} 70%,100%{transform:rotate(300deg)} }
      @keyframes vlLight { 0%,58%{fill:#33333a} 70%{fill:#7defdf} 100%{fill:#2c9c8e} }
      @keyframes vlGlow  { 0%,55%{opacity:.10} 76%{opacity:.5} 100%{opacity:.30} }
      #hq-splash .vl-wrap{ position:relative; width:200px; height:200px; display:flex; align-items:center; justify-content:center; }
      #hq-splash .vl-glowdiv{ position:absolute; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle,rgba(44,156,142,.8),transparent 60%); filter:blur(16px); animation:vlGlow 2.9s ease infinite; }
      #hq-splash .vl-door{ transform-origin:100px 100px; animation:vlSlam 2.9s cubic-bezier(.2,.85,.2,1) infinite; }
      #hq-splash .vl-wheel{ transform-origin:100px 100px; animation:vlWheel 2.9s cubic-bezier(.45,0,.2,1) infinite; }
      #hq-splash .vl-light{ animation:vlLight 2.9s ease infinite; }
      @media (prefers-reduced-motion: reduce) { #hq-splash .vl-door,#hq-splash .vl-wheel{ animation:none; } }
    </style>
  </head>
  <body>
    <!-- Splash istantanea: tema coerente + auto-rimozione dopo ~2s -->
    <div id="hq-splash">
      <div class="vl-wrap">
        <div class="vl-glowdiv"></div>
        <svg viewBox="0 0 200 200" width="200" height="200" style="position:relative;filter:drop-shadow(0 14px 40px rgba(0,0,0,.7))">
          <defs>
            <radialGradient id="vlSteelS" cx="36%" cy="28%" r="85%"><stop offset="0%" stop-color="#3d3d47"/><stop offset="55%" stop-color="#1b1b21"/><stop offset="100%" stop-color="#0a0a0d"/></radialGradient>
            <linearGradient id="vlRimS" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#54545f"/><stop offset="50%" stop-color="#23232a"/><stop offset="100%" stop-color="#44444e"/></linearGradient>
          </defs>
          <rect x="6" y="6" width="188" height="188" rx="38" fill="url(#vlSteelS)" stroke="#2a2a31" stroke-width="2"/>
          <circle cx="100" cy="100" r="78" fill="none" stroke="url(#vlRimS)" stroke-width="11"/>
          <g fill="#4a4a54"><circle cx="178" cy="100" r="3.4"/><circle cx="155.15" cy="155.15" r="3.4"/><circle cx="100" cy="178" r="3.4"/><circle cx="44.85" cy="155.15" r="3.4"/><circle cx="22" cy="100" r="3.4"/><circle cx="44.85" cy="44.85" r="3.4"/><circle cx="155.15" cy="44.85" r="3.4"/></g>
          <g class="vl-door">
            <circle cx="100" cy="100" r="66" fill="url(#vlSteelS)" stroke="#34343c" stroke-width="3"/>
            <circle cx="100" cy="100" r="58" fill="none" stroke="#26262d" stroke-width="1.5"/>
            <g class="vl-wheel">
              <g stroke="url(#vlRimS)" stroke-width="7" stroke-linecap="round">
                <line x1="100" y1="56" x2="100" y2="144"/><line x1="56" y1="100" x2="144" y2="100"/><line x1="69" y1="69" x2="131" y2="131"/><line x1="131" y1="69" x2="69" y2="131"/>
              </g>
              <g fill="#57575f"><circle cx="144" cy="100" r="5"/><circle cx="131.11" cy="131.11" r="5"/><circle cx="100" cy="144" r="5"/><circle cx="68.89" cy="131.11" r="5"/><circle cx="56" cy="100" r="5"/><circle cx="68.89" cy="68.89" r="5"/><circle cx="100" cy="56" r="5"/><circle cx="131.11" cy="68.89" r="5"/></g>
              <circle cx="100" cy="100" r="15" fill="url(#vlRimS)" stroke="#1e1e24" stroke-width="2"/>
              <circle cx="100" cy="100" r="5" fill="#0d0d11"/>
            </g>
          </g>
          <circle class="vl-light" cx="100" cy="22" r="4.5" fill="#33333a"/>
        </svg>
      </div>
    </div>
    <script>
      (function () {
        var s = document.getElementById('hq-splash');
        if (!s) return;
        try { if (localStorage.getItem('hq-theme') === 'light') s.classList.add('hq-light'); } catch (e) {}
        setTimeout(function () {
          s.classList.add('hq-hide');
          setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 550);
        }, 2700);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Blocca pinch-to-zoom su iOS Safari (ignora user-scalable=no)
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      // Blocca double-tap zoom
      var lastTap = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTap < 300) e.preventDefault();
        lastTap = now;
      }, { passive: false });
    </script>
  </body>
</html>
